services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
      - CACHE_TTL_SECONDS=86400
      - RATE_LIMIT_PER_MINUTE=30
      - BACKEND_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
